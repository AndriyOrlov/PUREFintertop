name: Python checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pylint==4.1.3
          python -m pip install --no-deps .
      - name: Test API and 1000-image acceptance case
        run: python -m unittest discover -s tests -v
      - name: Check standard Python runtime code
        # InspectPurRef.py executes inside Ghidra, which injects its own globals.
        run: python -m pylint --errors-only --ignore=_vendor src/pur_adapter tools/run_thousand.py tools/verify_native.py tools/research/compare_versions.py tests
      - name: Compile project
        run: python -m compileall -q src tools tests
