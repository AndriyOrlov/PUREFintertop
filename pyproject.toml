[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pur-adapter"
version = "0.3.0"
description = "Local PureRef document API and compatibility bridge"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.3"]
authors = [{name = "Andrii Orlov"}]
license = {text = "Apache-2.0"}

[project.scripts]
pur-adapter = "pur_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pur_adapter = ["data/*.pur"]
